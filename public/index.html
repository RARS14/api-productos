<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #2f4f4b;
      --papel: #ffffff;
      --tinta: #162623;
      --amarillo: #f2c230;
      --gris: #5b6b68;
      --error: #a8201a;
      --ok: #1e6b3a;
      --margen: 28px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--fondo);
      color: var(--tinta);
      font-family: "Barlow", "Segoe UI", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    .etiqueta {
      width: 100%;
      max-width: 440px;
      background: var(--papel);
    }

    .cabecera {
      background: var(--amarillo);
      border-bottom: 2px solid var(--tinta);
      padding: var(--margen);
    }

    .cabecera h1 {
      margin: 0;
      font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(2.8rem, 12vw, 3.8rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }

    .cabecera p {
      margin: 8px 0 0;
      font-weight: 500;
    }

    .contenido { padding: var(--margen); }

    h2 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 800;
      font-size: 1.9rem;
      line-height: 1;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      font: inherit;
      color: var(--tinta);
      background: var(--papel);
      border: 2px solid var(--tinta);
      border-radius: 2px;
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      color: var(--tinta);
      background: var(--papel);
      border: 2px solid var(--tinta);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #e9eeed; }
    button.principal { flex: 1; background: var(--amarillo); }
    button.principal:hover { background: #e0b020; }

    :focus-visible {
      outline: 3px solid var(--tinta);
      outline-offset: 2px;
    }

    #mensaje {
      min-height: 1.5em;
      margin: 16px 0 0;
      font-weight: 600;
    }
    #mensaje.error { color: var(--error); }
    #mensaje.ok { color: var(--ok); }

    .resultado {
      margin: 16px 0 0;
      padding: 12px;
      background: #eef2f1;
      border-left: 4px solid var(--amarillo);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
    }

    /* Talón desprendible con código de barras */
    .talon {
      position: relative;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 2px dashed var(--tinta);
    }

    .talon::before,
    .talon::after {
      content: "";
      position: absolute;
      top: -11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--fondo);
    }
    .talon::before { left: calc(-1 * var(--margen) - 10px); }
    .talon::after { right: calc(-1 * var(--margen) - 10px); }

    .codigo {
      height: 44px;
      background:
        repeating-linear-gradient(90deg, var(--tinta) 0 3px, transparent 3px 7px, var(--tinta) 7px 8px, transparent 8px 13px),
        repeating-linear-gradient(90deg, transparent 0 11px, var(--tinta) 11px 13px, transparent 13px 19px);
    }

    .talon p {
      margin: 8px 0 0;
      font-size: 0.85rem;
      color: var(--gris);
    }

    @media (max-width: 480px) {
      :root { --margen: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="etiqueta">
    <header class="cabecera">
      <h1>Inventario</h1>
      <p>Administra tus productos desde un solo lugar.</p>
    </header>

    <div class="contenido">
      <section id="seccion-login">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">

        <div class="botones">
          <button id="btn-login" class="principal">Iniciar sesión</button>
          <button id="btn-registro">Crear cuenta</button>
        </div>
      </section>

      <section id="seccion-sesion" hidden>
        <h2>Sesión iniciada</h2>
        <p>Ya puedes consultar los productos con tu token.</p>
        <div class="botones">
          <button id="btn-productos" class="principal">Ver productos</button>
          <button id="btn-logout">Cerrar sesión</button>
        </div>
      </section>

      <p id="mensaje" aria-live="polite"></p>
      <pre id="resultado" class="resultado" hidden></pre>

      <div class="talon">
        <div class="codigo" aria-hidden="true"></div>
        <p>Acceso protegido con token JWT</p>
      </div>
    </div>
  </main>

  <script>
    const seccionLogin = document.getElementById('seccion-login');
    const seccionSesion = document.getElementById('seccion-sesion');
    const mensaje = document.getElementById('mensaje');
    const resultado = document.getElementById('resultado');

    function mostrarMensaje(texto, correcto) {
      mensaje.textContent = texto;
      mensaje.className = correcto ? 'ok' : 'error';
    }

    function mostrarSesion() {
      const hayToken = localStorage.getItem('token');
      seccionLogin.hidden = !!hayToken;
      seccionSesion.hidden = !hayToken;
    }

    async function enviar(ruta) {
      const usuario = document.getElementById('usuario').value;
      const password = document.getElementById('password').value;
      const respuesta = await fetch('/api/auth/' + ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });
      const datos = await respuesta.json();
      mostrarMensaje(datos.token ? 'Inicio de sesión correcto' : datos.mensaje, respuesta.ok);
      if (datos.token) {
        localStorage.setItem('token', datos.token);
        mostrarSesion();
      }
    }

    document.getElementById('btn-login').addEventListener('click', () => enviar('login'));
    document.getElementById('btn-registro').addEventListener('click', () => enviar('register'));

    document.getElementById('btn-productos').addEventListener('click', async () => {
      const respuesta = await fetch('/api/productos', {
        headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }
      });
      const datos = await respuesta.json();
      resultado.hidden = false;
      resultado.textContent = JSON.stringify(datos, null, 2);
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      resultado.hidden = true;
      mostrarMensaje('Sesión cerrada', true);
      mostrarSesion();
    });

    mostrarSesion();
  </script>
</body>
</html>
